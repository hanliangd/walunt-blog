<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的AI助手</title>
    <link rel="stylesheet" href="./notes/note.css" />
    <link rel="stylesheet" href="./chat.css?v=20261113-2" />
  </head>
  <body>
    <div class="bg-layer" aria-hidden="true"></div>
    <div class="app-container">
      <!-- 侧边栏 -->
      <aside id="sidebarPanel" class="sidebar">
        <div class="sidebar-toolbar">
          <button id="newChatBtn" class="new-chat-btn">＋ 新会话</button>
          <button
            id="collapseSidebarBtn"
            class="sidebar-icon-btn"
            type="button"
            aria-label="收起侧边栏"
            aria-controls="sidebarPanel"
            aria-expanded="true"
            title="收起侧边栏"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="4.5" width="17" height="15" rx="2.5"></rect>
              <path d="M9 5v14M15 9l-3 3 3 3"></path>
            </svg>
          </button>
        </div>
        <div id="conversationList" class="conversation-list"></div>
      </aside>
      <!-- 窄屏抽屉遮罩：桌面端 display:none，不参与布局 -->
      <div class="sidebar-scrim" id="sidebarScrim" aria-hidden="true"></div>
      <!-- 主聊天区域 -->
      <main class="chat-container">
        <div class="chat-header">
          <button
            id="expandSidebarBtn"
            class="sidebar-icon-btn"
            type="button"
            aria-label="展开侧边栏"
            aria-controls="sidebarPanel"
            aria-expanded="true"
            title="展开侧边栏"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="4.5" width="17" height="15" rx="2.5"></rect>
              <path d="M9 5v14m3-7h5m-2-3 3 3-3 3"></path>
            </svg>
          </button>
          <span id="currentConversationTitle" class="chat-title">新会话</span>
          <button
            type="button"
            class="theme-toggle"
            data-theme-toggle
            aria-label="切换主题"
            title="切换主题"
          >
            <svg
              class="theme-icon theme-icon--moon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M20.2 15.3A8.5 8.5 0 0 1 8.7 3.8 8.5 8.5 0 1 0 20.2 15.3Z"
              ></path>
            </svg>
            <svg
              class="theme-icon theme-icon--sun"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="3.7"></circle>
              <path
                d="M12 2v2.2M12 19.8V22M4.93 4.93l1.56 1.56m11.02 11.02 1.56 1.56M2 12h2.2m15.6 0H22M4.93 19.07l-1.56 1.56M17.51 6.49l1.56-1.56"
              ></path>
            </svg>
          </button>
          <span id="userInfo">加载中...</span>
        </div>
        <div id="out"></div>
        <div class="input-area">
          <div class="composer-shell">
            <input type="text" id="msg" placeholder="说点什么呢……" />
            <button id="sent">发送</button>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="./chat-ui.js?v=20261113-2"></script>
    <script src="./theme-toggle.js"></script>
    <script src="./vendor/marked.min.js"></script>
    <script src="./vendor/purify.min.js"></script>
  </body>
</html>
