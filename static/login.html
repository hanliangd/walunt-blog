<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        min-height: 100vh;
        background: radial-gradient(
          circle at 30% 0%,
          #ffffff 10%,
          #f0f4f8 25%,
          #d8e2f0 60%,
          #c0d0f0 100%
        );
      }
      /* 背景视频 */
      .video-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
      }
      /* 外层卡片 */
      .login-card {
        display: flex;
        overflow: hidden;
        width: 840px;
        height: 480px;
        align-self: center;
        margin: auto 0 auto 4%;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
        background-color: #ffffff;
      }
      /* 左侧插图 */
      .login-illust {
        width: 320px;
        height: 480px;
      }
      .illust-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* 右侧表单区 */
      .login-form {
        width: 520px;
        height: 480px;
        text-align: center;
        background-color: #ffffff;
      }
      .login-title {
        color: #667eea;
        font: 700 30px sans-serif;
        margin: 30px;
      }
      /* 输入框（合并了原来的 input1 和 input2） */
      .login-input {
        width: 360px;
        height: 40px;
        border: none;
        border-bottom: 1px solid #c0d0f0;
        background-color: #ffffff;
        margin: 20px;
        padding-left: 10px;
      }
      .login-input:focus {
        outline: none;
        border-color: #667eea;
      }
      /* 错误提示 */
      .error-msg {
        color: red;
        font-size: 14px;
        height: 20px;
        margin-top: 10px;
      }
      /* 登录按钮 */
      .login-btn {
        width: 200px;
        height: 40px;
        margin: 30px;
        background-color: #667eea;
        border: none;
        color: #ffffff;
        border-radius: 20px;
        cursor: pointer;
        transition: transform 0.2s;
      }
      .login-btn:hover {
        transform: scale(1.02);
      }
      /* 底部链接 */
      .link-box {
        display: flex;
        justify-content: space-between;
        width: 80%;
        margin: 30px auto 0;
      }
      .link {
        color: #667eea;
        text-decoration: none;
        font-size: 14px;
      }
      .link:hover {
        color: aqua;
      }

      /* ===== 移动端适配 =====
         桌面端卡片是写死的 840×480（320 插图 + 520 表单），
         窄屏下整体溢出视口，输入框 360px 也超出可用宽度。
         这里改成纵向堆叠 + 全宽表单，字号提到 16px 以避免 iOS 聚焦自动放大。 */
      @media (max-width: 900px) {
        body {
          min-height: 100dvh;
          padding: 24px 16px;
          align-items: center;
          justify-content: center;
        }
        .login-card {
          flex-direction: column;
          width: 100%;
          max-width: 420px;
          height: auto;
          margin: auto;
          border-radius: 18px;
        }
        .login-illust {
          width: 100%;
          height: 190px;
          flex: 0 0 auto;
        }
        .login-form {
          width: 100%;
          height: auto;
          padding: 26px 22px 28px;
        }
        .login-title {
          margin: 0 0 22px;
          font-size: 26px;
        }
        .login-input {
          width: 100%;
          height: 46px;
          margin: 0 0 16px;
          padding-left: 12px;
          font-size: 16px;
        }
        .error-msg {
          height: auto;
          min-height: 20px;
          margin-top: 0;
          font-size: 13px;
        }
        .login-btn {
          width: 100%;
          height: 46px;
          margin: 18px 0 0;
          font-size: 16px;
        }
        .link-box {
          width: 100%;
          margin: 18px 0 0;
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 16px 12px;
        }
        .login-illust {
          height: 150px;
        }
        .login-form {
          padding: 22px 18px 24px;
        }
        .login-title {
          font-size: 23px;
        }
      }

      /* 手机上不加载那段 77MB 的背景视频：由脚本按视口决定是否插入 <source>，
         这里只负责在窄屏把它藏掉，露出 body 本身的渐变底色。 */
      @media (max-width: 900px) {
        .video-bg {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .login-btn {
          transition: none;
        }
        .login-btn:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <video class="video-bg" autoplay loop muted playsinline aria-hidden="true"></video>
    <!-- 外层卡片容器 -->
    <div class="login-card">
      <!-- 左侧插图区 -->
      <div class="login-illust">
        <img
          src="./img/pixiv_works_133187084_p0.png"
          alt="伊雷娜好可爱"
          class="illust-img"
        />
      </div>

      <!-- 右侧表单区 -->
      <div class="login-form">
        <div class="login-title">登录</div>

        <!-- 1. 表单包裹，加上 id -->
        <form id="loginForm">
          <!-- 2. 输入框加上 id -->
          <input
            type="text"
            placeholder="用户名"
            class="login-input"
            id="username"
          />
          <input
            type="password"
            placeholder="密码"
            class="login-input"
            id="password"
          />

          <!-- 3. 错误信息显示区 -->
          <div id="errorMsg" class="error-msg"></div>

          <div>
            <button type="submit" class="login-btn">Login</button>
          </div>
        </form>

        <div class="link-box">
          <a href="#" class="link">找回密码</a>
        </div>
      </div>
    </div>
    <script>
      // 背景视频按视口加载：那段 mp4 有 77MB，手机上用 CSS 渐变底色替代。
      // 只插入 <source> 不触发下载，必须 load() 之后才会真正开始取流。
      (function () {
        const video = document.querySelector(".video-bg");
        const wide = window.matchMedia("(min-width: 901px)");
        function syncVideo() {
          if (wide.matches) {
            if (!video.querySelector("source")) {
              const source = document.createElement("source");
              source.src = "./img/【哲风壁纸】伊蕾娜-傍晚.mp4";
              source.type = "video/mp4";
              video.appendChild(source);
              video.load();
            }
          } else if (video.querySelector("source")) {
            video.pause();
            video.replaceChildren();
            video.removeAttribute("src");
            video.load();
          }
        }
        syncVideo();
        wide.addEventListener("change", syncVideo);
      })();
    </script>
    <script>
      const form = document.querySelector("#loginForm");
      const errorMsg = document.querySelector("#errorMsg");
      async function login(e) {
        e.preventDefault(); // 阻止表单默认刷新
        errorMsg.textContent = ""; // 清空之前的错误提示
        const username = document.querySelector("#username").value;
        const password = document.querySelector("#password").value;
        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          if (!res.ok) {
            const errorData = await res.json();
            errorMsg.textContent = errorData.detail || "用户名或密码错误";
            return;
          }
          const next =
            new URLSearchParams(location.search).get("next") ||
            "/static/index.html";
          window.location.href = next;
        } catch (error) {
          errorMsg.textContent = "网络连接失败，请稍后重试";
          console.error(error);
        }
      }
      form.addEventListener("submit", login);
    </script>
  </body>
</html>
