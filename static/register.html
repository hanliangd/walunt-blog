<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <style>
      /* 你的 CSS 完全不用变，直接复制过来 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        min-height: 100vh;
        background: radial-gradient(
          circle at 30% 0%,
          #ffffff 10%,
          #f0f4f8 25%,
          #d8e2f0 60%,
          #c0d0f0 100%
        );
      }
      .video-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
      }
      .login-card {
        display: flex;
        overflow: hidden;
        width: 840px;
        height: 480px;
        align-self: center;
        margin: auto 0 auto 4%;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
        background-color: #ffffff;
      }
      .login-illust {
        width: 320px;
        height: 480px;
      }
      .illust-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .login-form {
        width: 520px;
        height: 480px;
        text-align: center;
        background-color: #ffffff;
      }
      .login-title {
        color: #667eea;
        font: 700 30px sans-serif;
        margin: 30px;
      }
      .login-input {
        width: 360px;
        height: 40px;
        border: none;
        border-bottom: 1px solid #c0d0f0;
        background-color: #ffffff;
        margin: 20px;
        padding-left: 10px;
      }
      .login-input:focus {
        outline: none;
        border-color: #667eea;
      }
      .error-msg {
        color: red;
        font-size: 14px;
        height: 20px;
        margin-top: 10px;
      }
      .login-btn {
        width: 200px;
        height: 40px;
        margin: 30px;
        background-color: #667eea;
        border: none;
        color: #ffffff;
        border-radius: 20px;
        cursor: pointer;
        transition: transform 0.2s;
      }
      .login-btn:hover {
        transform: scale(1.02);
      }
      .link-box {
        display: flex;
        justify-content: space-between;
        width: 80%;
        margin: 30px auto 0;
      }
      .link {
        color: #667eea;
        text-decoration: none;
        font-size: 14px;
      }
      .link:hover {
        color: aqua;
      }
    </style>
  </head>
  <body>
    <video class="video-bg" autoplay loop muted playsinline>
      <source src="./img/爱弥斯.mp4" type="video/mp4" />
    </video>

    <div class="login-card">
      <div class="login-illust">
        <img src="./img/娅娅.jpg" alt="伊雷娜好可爱" class="illust-img" />
      </div>

      <div class="login-form">
        <!-- 改：标题变成注册 -->
        <div class="login-title">注册</div>

        <form id="registerForm">
          <!-- 加上 required 和 maxlength 限制，与后端保持一致 -->
          <input
            type="text"
            placeholder="用户名 (3-20位)"
            class="login-input"
            id="username"
            required
            minlength="3"
            maxlength="20"
          />
          <input
            type="password"
            placeholder="密码 (至少6位)"
            class="login-input"
            id="password"
            required
            minlength="6"
          />

          <div id="errorMsg" class="error-msg"></div>

          <div>
            <!-- 改：按钮文字变成注册 -->
            <button type="submit" class="login-btn">Register</button>
          </div>
        </form>

        <div class="link-box">
          <!-- 改：底部链接变成“去登录” -->
          <a href="./login.html" class="link">已有账号？去登录</a>
          <a href="#" class="link">找回密码</a>
        </div>
      </div>
    </div>

    <script>
      const form = document.querySelector("#registerForm");
      const errorMsg = document.querySelector("#errorMsg");

      async function register(e) {
        e.preventDefault(); // 阻止表单刷新
        errorMsg.textContent = ""; // 清空错误提示

        const username = document.querySelector("#username").value;
        const password = document.querySelector("#password").value;

        try {
          // 调注册接口
          const res = await fetch("/api/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });

          if (!res.ok) {
            // 处理 409 用户名冲突等错误
            const errorData = await res.json();
            errorMsg.textContent = errorData.detail || "注册失败，请重试";
            return;
          }

          // 注册成功，提示并跳转到登录页
          alert("注册成功！即将跳转到登录页...");
          window.location.href = "./login.html";
        } catch (error) {
          errorMsg.textContent = "网络连接失败，请稍后重试";
          console.error(error);
        }
      }

      form.addEventListener("submit", register);
    </script>
  </body>
</html>
