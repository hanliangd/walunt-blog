               这里只放结构，JS 只负责换主题和那两行文案。
               初始文案必须是浅色态那套（= 日间模式 / 晨光熹微），JS 没跑起来也不能错 -->
          <li>
            <div class="card-glass theme-card" id="themeCard" role="button" tabindex="0">

              </div>

            </div>

    <!-- AI 对话入口：左下角悬浮按钮（和右上角的主题切换按钮对角对称） -->
    <style>
      .chat-fab{
        position:fixed; left:24px; bottom:28px; z-index:9998;
        display:flex; align-items:center; gap:8px;
        padding:11px 18px; border-radius:999px;
        background:linear-gradient(135deg, rgba(99,102,241,.95), rgba(139,92,246,.95));
        color:#fff; text-decoration:none;
        font-size:14px; font-weight:600; letter-spacing:.02em;
        box-shadow:0 6px 22px rgba(79,70,229,.38);
        backdrop-filter:blur(10px);
        transition:transform .18s ease, box-shadow .18s ease;
      }
      .chat-fab:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 10px 28px rgba(79,70,229,.5);}
      .chat-fab:active{transform:scale(.97);}
      .chat-fab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
      @media (max-width:768px){
        .chat-fab{left:12px;bottom:14px;padding:9px 14px;font-size:13px;}
      }
    </style>
